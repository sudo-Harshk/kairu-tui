<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Agents Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #1e293b;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid #e2e8f0;
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 16px;
      color: #64748b;
      margin-top: 8px;
      font-weight: 400;
    }

    .last-updated {
      display: inline-block;
      margin-top: 12px;
      font-size: 13px;
      color: #94a3b8;
    }

    section {
      padding: 40px 0;
    }

    section + section {
      border-top: 1px solid #e2e8f0;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .section-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      border-color: #cbd5e1;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .card-icon img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .card-icon .fallback {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .card-name {
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
    }

    .card-company {
      font-size: 13px;
      color: #64748b;
      font-weight: 400;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .command-block {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .command-block code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      color: #0f172a;
      word-break: break-all;
    }

    .copy-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .copy-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
      color: #64748b;
    }

    .copy-btn.copied svg {
      color: #22c55e;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .tag-cli {
      background: #eff6ff;
      color: #2563eb;
    }

    .tag-ide {
      background: #f0fdf4;
      color: #16a34a;
    }

    .tag-other {
      background: #fef3c7;
      color: #d97706;
    }

    .card-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
    }

    .card-path {
      font-size: 12px;
      color: #94a3b8;
      word-break: break-all;
    }

    .card-path span {
      color: #64748b;
      font-weight: 500;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0f172a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      font-family: 'Poppins', sans-serif;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      header { padding: 32px 0 24px; }
      header h1 { font-size: 24px; }
      section { padding: 28px 0; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <header>
      <h1>Coding Agents Reference</h1>
      <p>Quick reference for all AI coding agents installed on this machine</p>
      <span class="last-updated">Last updated: June 3, 2026</span>
    </header>

    <section>
      <h2 class="section-title">CLI Coding Agents</h2>
      <p class="section-desc">Command-line tools — open a terminal and run the command shown</p>

      <div class="grid" id="cli-grid"></div>
    </section>

    <section>
      <h2 class="section-title">AI IDEs &amp; Editors</h2>
      <p class="section-desc">Desktop applications with built-in AI coding agents</p>

      <div class="grid" id="ide-grid"></div>
    </section>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CLI_AGENTS = [
      {
        name: 'opencode',
        company: 'opencode',
        icon: 'https://cdn.simpleicons.org/opencode/1e293b',
        iconBg: '#f1f5f9',
        command: 'opencode',
        desc: 'AI coding assistant CLI — agentic coding in your terminal.',
        path: 'npm global (v1.15.13)',
        tag: 'CLI'
      },
      {
        name: 'Claude Code',
        company: 'Anthropic',
        icon: 'https://cdn.simpleicons.org/anthropic/1e293b',
        iconBg: '#fce7f3',
        command: 'claude',
        desc: 'Anthropic\'s agentic coding tool powered by Claude.',
        path: '~/.local/bin/claude.exe',
        tag: 'CLI'
      },
      {
        name: 'Codex CLI',
        company: 'OpenAI',
        icon: '<i class="bi bi-openai" style="font-size:22px;color:#1e293b"></i>',
        iconBg: '#f0f9ff',
        command: 'codex',
        desc: 'OpenAI\'s terminal-based coding agent.',
        path: 'npm global (v0.130.0)',
        tag: 'CLI'
      },
      {
        name: 'Gemini CLI',
        company: 'Google',
        icon: 'https://cdn.simpleicons.org/google/1e293b',
        iconBg: '#fefce8',
        command: 'gemini',
        desc: 'Google\'s AI coding assistant powered by Gemini.',
        path: 'npm global (v0.42.0)',
        tag: 'CLI'
      },
      {
        name: 'PI Coding Agent',
        company: 'Pi',
        icon: '<span style="font-size:22px;font-weight:600;color:#1e293b">π</span>',
        iconBg: '#f3e8ff',
        command: 'pi',
        desc: 'Minimal terminal coding harness — extend with TypeScript extensions, skills, and themes.',
        path: 'npm global (v0.75.5)',
        tag: 'CLI'
      },
      {
        name: 'GitHub Copilot CLI',
        company: 'GitHub',
        icon: 'https://cdn.simpleicons.org/github/1e293b',
        iconBg: '#f8fafc',
        command: 'copilot',
        desc: 'GitHub\'s AI pair programmer in the terminal.',
        path: 'npm global',
        tag: 'CLI'
      },
      {
        name: 'Vibe',
        company: 'Vibe',
        icon: '',
        iconBg: '#ecfdf5',
        command: 'vibe',
        desc: 'AI coding agent for vibe-coded development sessions.',
        path: '~/.local/bin/vibe.exe',
        tag: 'CLI'
      },
      {
        name: 'cagent',
        company: 'Docker',
        icon: 'https://cdn.simpleicons.org/docker/1e293b',
        iconBg: '#eff6ff',
        command: 'cagent run <config.yaml>',
        desc: 'Docker\'s multi-agent runtime with TUI and MCP support.',
        path: 'Docker Desktop plugin',
        tag: 'CLI'
      }
    ];

    const IDE_AGENTS = [
      {
        name: 'Cursor',
        company: 'Anysphere',
        icon: 'https://cdn.simpleicons.org/cursor/1e293b',
        iconBg: '#f1f5f9',
        command: 'cursor .',
        desc: 'AI-native code editor with built-in agent mode.',
        path: 'Config at ~/.cursor',
        tag: 'IDE'
      },
      {
        name: 'Windsurf',
        company: 'Codeium',
        icon: 'https://cdn.simpleicons.org/codeium/1e293b',
        iconBg: '#f0fdf4',
        command: 'windsurf .',
        desc: 'AI IDE by Codeium with cascading agent flows.',
        path: '%LOCALAPPDATA%\\Programs\\Windsurf',
        tag: 'IDE'
      },
      {
        name: 'Trae',
        company: 'ByteDance',
        icon: '',
        iconBg: '#fef2f2',
        command: 'Launch from Start Menu',
        desc: 'AI-powered IDE by ByteDance.',
        path: '%LOCALAPPDATA%\\Programs\\Trae',
        tag: 'IDE'
      },
      {
        name: 'Antigravity IDE',
        company: 'Google',
        icon: 'https://cdn.simpleicons.org/google/1e293b',
        iconBg: '#fefce8',
        command: 'Launch from Start Menu',
        desc: 'Google\'s experimental AI-native IDE.',
        path: '%LOCALAPPDATA%\\Programs\\Antigravity',
        tag: 'IDE'
      },
      {
        name: 'Kiro',
        company: 'Amazon',
        icon: 'https://cdn.simpleicons.org/amazon/1e293b',
        iconBg: '#fffbeb',
        command: 'Launch from Start Menu',
        desc: 'Amazon\'s AI coding assistant IDE.',
        path: '%LOCALAPPDATA%\\Programs\\Kiro',
        tag: 'IDE'
      },
      {
        name: 'VS Code',
        company: 'Microsoft',
        icon: 'https://cdn.simpleicons.org/visualstudiocode/1e293b',
        iconBg: '#eff6ff',
        command: 'code .',
        desc: 'Popular editor with GitHub Copilot built-in.',
        path: '%LOCALAPPDATA%\\Programs\\Microsoft VS Code',
        tag: 'IDE'
      },
      {
        name: 'Zed',
        company: 'Zed Industries',
        icon: 'https://cdn.simpleicons.org/zedindustries/1e293b',
        iconBg: '#f8fafc',
        command: 'zed .',
        desc: 'High-performance editor with AI features.',
        path: '%LOCALAPPDATA%\\Programs\\Zed',
        tag: 'IDE'
      }
    ];

    function handleIconError(img) {
      const fallback = document.createElement('span');
      fallback.className = 'fallback';
      fallback.textContent = img.alt ? img.alt[0] : '?';
      img.parentElement.innerHTML = '';
      img.parentElement.appendChild(fallback);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._hide);
      t._hide = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function renderCard(agent) {
      const tagClass = agent.tag === 'CLI' ? 'tag-cli' : agent.tag === 'IDE' ? 'tag-ide' : 'tag-other';

      let iconContent;
      if (agent.icon && agent.icon.startsWith('http')) {
        iconContent = `<img src="${escapeHtml(agent.icon)}" alt="${escapeHtml(agent.name)}" loading="lazy" onerror="handleIconError(this)">`;
      } else if (agent.icon) {
        iconContent = agent.icon;
      } else {
        iconContent = `<span class="fallback">${escapeHtml(agent.name[0])}</span>`;
      }

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-icon" style="background: ${agent.iconBg}">
              ${iconContent}
            </div>
            <div>
              <div class="card-name">${escapeHtml(agent.name)} <span class="card-tag ${tagClass}">${agent.tag}</span></div>
              <div class="card-company">${escapeHtml(agent.company)}</div>
            </div>
          </div>
          <div class="card-body">
            <div class="command-block">
              <code>${escapeHtml(agent.command)}</code>
              <button class="copy-btn" data-cmd="${escapeHtml(agent.command)}" title="Copy command" aria-label="Copy command">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>
            </div>
            <div class="card-desc">${escapeHtml(agent.desc)}</div>
            <div class="card-path"><span>Location:</span> ${escapeHtml(agent.path)}</div>
          </div>
        </div>
      `;
    }

    function renderGrid(agents, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = agents.map(renderCard).join('');

      container.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const cmd = this.getAttribute('data-cmd');
          copyToClipboard(cmd);
          this.classList.add('copied');
          showToast('Copied!');
          setTimeout(() => this.classList.remove('copied'), 1200);
        });
      });
    }

    renderGrid(CLI_AGENTS, 'cli-grid');
    renderGrid(IDE_AGENTS, 'ide-grid');
  </script>

</body>
</html>
